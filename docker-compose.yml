services:
  app-db:
    image: postgres:16-alpine
    container_name: gsw-app-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: workspace_app
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d workspace_app"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - app-db-data:/var/lib/postgresql/data

  target-db:
    image: postgres:16-alpine
    container_name: gsw-target-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - target-db-data:/var/lib/postgresql/data

volumes:
  app-db-data:
  target-db-data:
